name: auth
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  readflag:
    runs-on: ubuntu-latest
    steps:
      - name: Show the OIDC subject
        run: echo "sub = repo:${{ github.repository }}:ref:${{ github.ref }}"

      - uses: azure/login@v2
        with:
          client-id: 38d4132a-6760-45bf-a2f1-fc500618626c
          tenant-id: fdd066e1-ee37-49bc-b08f-d0e152119b04
          subscription-id: 56c0b220-b032-47c9-b6af-69521f9c26e3

      - name: Prove who we are
        run: az account show

      - name: Read the flag
        run: |
          az storage blob download \
            --account-name iamazurelab39874cdaa \
            --container-name flag \
            --name flag.txt \
            --auth-mode login \
            --file /dev/stdout \
            --no-progress
